<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kiosco 24/7 - Open Design</title>

    <!-- VINCULACIÓN DE LA CAPA DE PRESENTACIÓN -->

    <link rel="stylesheet" href="styles.css">

</head>
<body>

    <div class="test-system-banner">
      Es un sistema de prueba, no lo molesten a Maxi (tanto)
    </div>

    <!-- LÍMITE DEL SISTEMA -->
    <div class="takeaway-app-container">

      <!-- CABECERA: Estado Global -->
      <header class="app-header">
        <nav>
          <h1>Sistema Take Away</h1>
          <div class="global-status">
            <span>Ítems en pedido: <output id="cart-counter">0</output></span>
          </div>
        </nav>
      </header>

      <!-- CONTENIDO PRINCIPAL: Lógica de Dominio -->
      <main class="app-main">
        
        <!-- MÓDULO A: Catálogo de Productos -->
        <section class="product-catalog" aria-labelledby="catalog-title">
          <h2 id="catalog-title">Menú Disponible</h2>

          <!-- MÓDULO DE BÚSQUEDA Y FILTRADO -->
          <header class="catalog-controls">
              <input type="search" id="search-engine" placeholder="Buscar productos..." autocomplete="off">
              
              <nav class="category-filters">
                  <button type="button" class="btn-filter active" data-category="all">Todos</button>
                  <button type="button" class="btn-filter" data-category="golosinas">Golosinas</button>
                  <button type="button" class="btn-filter" data-category="bebidas">Bebidas</button>
                  <button type="button" class="btn-filter" data-category="almacen">Almacén</button>
              </nav>
          </header>

          <!-- El contenedor inicia vacío, el controlador lo llenará -->
          <div class="catalog-grid"></div>
        </section>

        <!-- MÓDULO B: Estado Persistente (Carrito) -->
        <aside class="shopping-cart-panel" aria-labelledby="cart-title">
          <h2 id="cart-title">Tu Pedido Actual</h2>
          
          <!-- Lista Dinámica vacía por defecto -->
          <ul class="cart-item-list"></ul>

          <!-- MÓDULO DE CAPTURA DE DATOS (Reducido) -->
          <div class="cart-summary">
            <div class="cart-total-display">
                <span>Total:</span>
                <span class="total-value">$0.00</span>
            </div>

            <form id="checkout-form" class="checkout-form-module" autocomplete="off">
                <div class="input-group">
                    <label for="actor-name">Identificador (Nombre):</label>
                    <input type="text" id="actor-name" name="actorName" placeholder="Ej. Juan Pérez" required>
                    <span class="error-trace" id="error-name"></span>
                </div>
                
                <button type="button" class="btn-checkout" disabled>Confirmar Transacción</button>
            </form>
          </div>
        </aside>

      </main>
    </div>

    <!-- MÓDULO DE TELEMETRÍA VISUAL (Notificaciones Asíncronas) -->
    <div id="telemetry-console" class="telemetry-console"></div>

    <!-- VINCULACIÓN DEL CONTROLADOR -->
    <script type="module" src="app.js"></script>

</body>
</html>
